name: Build APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Debug and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standard Debug APK
        run: ./gradlew assembleStandardDebug

      - name: Build Standard Release APK
        run: ./gradlew assembleStandardRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quick-search-debug
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quick-search-release
          path: app/build/outputs/apk/standard/release/app-standard-release.apk
